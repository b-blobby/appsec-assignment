apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vulntracker.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vulntracker.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          # Secret values come from the Kubernetes Secret created by the
          # ExternalSecret resource below. No secret values are stored here.
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulntracker.fullname" . }}-secrets
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulntracker.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulntracker.fullname" . }}-secrets
                  key: ADMIN_API_KEY
            - name: ALGORITHM
              value: {{ .Values.env.ALGORITHM | quote }}
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: {{ .Values.env.ACCESS_TOKEN_EXPIRE_MINUTES | quote }}
            - name: NOTIFY_SERVICE_URL
              value: {{ .Values.env.NOTIFY_SERVICE_URL | quote }}
            - name: SHARE_BASE_URL
              value: {{ .Values.env.SHARE_BASE_URL | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            # Needed for SQLite in the prototype while keeping the root
            # filesystem read-only. Replace with an external database in prod.
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
